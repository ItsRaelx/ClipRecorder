# Categories for automatically generated release notes (gh release create --generate-notes).
changelog:
  exclude:
    labels: ["ignore-for-release"]
    authors: ["dependabot"]
  categories:
    - title: ✨ New features
      labels: ["enhancement"]
    - title: 🐞 Fixes
      labels: ["bug"]
    - title: 📖 Documentation
      labels: ["documentation"]
    - title: Other changes
      labels: ["*"]
