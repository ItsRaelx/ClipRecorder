name: Release (macOS)

# Runs when a tag is pushed, e.g.: git tag v1.0.0 && git push origin v1.0.0
# v* tags are macOS releases; Windows uses separate windows-v* tags.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    env:
      # Set them in Settings → Secrets and variables → Actions (see macos/RELEASING.md).
      # Without them the workflow publishes an ad-hoc signed test release.
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
      NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build number = number of commits

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version
      - name: Import Developer ID certificate
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm $RUNNER_TEMP/cert.p12

      - name: Prepare notarization key
        if: env.NOTARY_KEY_P8_BASE64 != ''
        run: |
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > $RUNNER_TEMP/AuthKey.p8
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> $GITHUB_ENV

      - name: Build release
        run: ./release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -n "$DEVELOPER_ID" ]; then
            NOTES="Download **ClipRecorder-$VERSION.dmg**, open it and drag ClipRecorder into Applications."$'\n\n'"🇵🇱 Pobierz **ClipRecorder-$VERSION.dmg**, otwórz i przeciągnij ClipRecorder do Aplikacji."
          else
            NOTES="⚠️ Test release – not signed with an Apple certificate. After the first launch go to System Settings → Privacy & Security → Open Anyway. After every update you need to grant the screen recording and microphone permissions again."$'\n\n'"🇵🇱 ⚠️ Wydanie testowe – niepodpisane certyfikatem Apple. Po pierwszym uruchomieniu: Ustawienia systemowe → Prywatność i ochrona → „Otwórz mimo to”. Po każdej aktualizacji trzeba ponownie nadać uprawnienia do nagrywania ekranu i mikrofonu."
          fi
          # --latest: the macOS app checks for updates via /releases/latest,
          # so the repository's "latest" release must always be a macOS release.
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 --latest \
            --title "ClipRecorder $VERSION (macOS)" --notes "$NOTES" --generate-notes

      - name: Clean up keychain
        if: always() && env.MACOS_CERT_P12_BASE64 != ''
        run: security delete-keychain $RUNNER_TEMP/signing.keychain-db || true
