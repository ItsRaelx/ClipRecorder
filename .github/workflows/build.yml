name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build DMG (universal, ad-hoc signed)
        run: ./release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ClipRecorder-dmg
          path: dist/*.dmg
