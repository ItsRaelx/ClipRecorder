name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Bundle app (ad-hoc signed)
        run: SIGN_IDENTITY=- ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ClipRecorder.app
          path: build/ClipRecorder.app
