name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version
      - name: Build DMG (universal, ad-hoc signed)
        run: ./release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ClipRecorder-dmg
          path: dist/*.dmg
