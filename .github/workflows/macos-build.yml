name: Build (macOS)

on:
  push:
    branches: [main]
    paths: ["macos/**", ".github/workflows/macos-*.yml"]
  pull_request:
    paths: ["macos/**", ".github/workflows/macos-*.yml"]

# The build only reads the repository; artifacts don't need token permissions.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version
      - name: Build DMG (universal, ad-hoc signed)
        run: ./release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ClipRecorder-dmg
          path: macos/dist/*.dmg
