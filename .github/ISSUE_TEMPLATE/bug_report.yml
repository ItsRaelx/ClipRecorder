name: 🐞 Report a bug
description: Something doesn't work the way it should.
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Before you submit, please check
        [troubleshooting](https://github.com/ItsRaelx/ClipRecorder/blob/main/docs/en/macos/troubleshooting.md)
        and [existing issues](https://github.com/ItsRaelx/ClipRecorder/issues?q=is%3Aissue).
        You can write in English or Polish.

        **Report security vulnerabilities privately** – see [SECURITY.md](https://github.com/ItsRaelx/ClipRecorder/blob/main/SECURITY.md).
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: ClipRecorder version
      description: Settings → bottom-left corner of the window.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: System and computer
      placeholder: "macOS 15.3, MacBook Air M2"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Video recording
        - Audio (system / microphone)
        - Keyboard shortcuts
        - Preview after saving / trimming
        - Sharing by link (clip.secc.me)
        - Settings
        - Pausing / battery / screen lock
        - Automation (cliprecorder://)
        - Installation / permissions / updates
        - Other
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem. A screenshot or a short recording helps a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set the buffer to 5 min
        2. Press ⌃⌥S
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: |
        On macOS, run this in Terminal, reproduce the problem and paste the output:
        `log stream --predicate 'process == "ClipRecorder"' --level info`
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: I checked that
      options:
        - label: I'm using the latest version of the app
        - label: there's no similar issue yet
          required: true
