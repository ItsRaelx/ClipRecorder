name: 💡 Feature idea
description: Suggest a new feature or an improvement.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: You can write in English or Polish.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Both
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe when you miss it, e.g. "When I play …, I'd like to …".
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could it work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other solutions, or apps that do this well.
  - type: checkboxes
    id: checks
    attributes:
      label: I checked that
      options:
        - label: there's no similar idea in issues or Discussions
          required: true
